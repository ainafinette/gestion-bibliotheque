<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bibliotheque - Accueil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/nav :: nav}"></header>
 
<div class="container mt-4">
    <h1><i class="bi bi-clock-history"></i> Historique des actions</h1>

    <div class="card mt-4">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Action</th>
                    <th>Description</th>
                    <th>Client</th>
                    <th>Livre</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h, iter : ${historiques}">
                    <td th:text="${iter.index + 1}"></td>
                    <td th:text="${#temporals.format(h.dateAction, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${h.action == 'EMPRUNT' ? 'bg-warning' :
                                              (h.action == 'RETOUR' ? 'bg-success' :
                                              (h.action == 'AJOUT' ? 'bg-primary' : 'bg-secondary'))}"
                              th:text="${h.action}"></span>
                    </td>
                    <td th:text="${h.description}"></td>
                    <td th:text="${h.client != null ? h.client.nom : '—'}"></td>
                    <td th:text="${h.livre != null ? h.livre.titre : '—'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(historiques)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                        <p>Aucun historique disponible</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
