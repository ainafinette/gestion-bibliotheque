<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord - Bibliothèque</title>
      <link rel="stylesheet" th:href="@{/css/style.css}">
   
    <link th:href="@{/css/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head> 
 <header th:replace="~{fragments/nav :: nav}"></header>

<body class="bg-light">

 


<div class="container-fluid px-4 py-4">

    <!-- ===== TITRE ===== -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="bi bi-speedometer2 text-primary"></i> Tableau de bord
        </h1>
        <span class="text-muted small" th:text="${#temporals.format(#temporals.createNow(), 'EEEE dd MMMM yyyy')}"></span>
    </div>

    <!-- ===== CARTES STATS ===== -->
    <div class="row g-4 mb-4">
        <div class="col-md-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100" style="border-left: 5px solid #0d6efd !important;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-uppercase text-muted small fw-bold mb-2">Livres</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalLivres}">0</div>
                        </div>
                        <div class="bg-primary bg-opacity-10 rounded-circle p-3">
                            <i class="bi bi-book fs-3 text-primary"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100" style="border-left: 5px solid #198754 !important;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-uppercase text-muted small fw-bold mb-2">Clients</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalClients}">0</div>
                        </div>
                        <div class="bg-success bg-opacity-10 rounded-circle p-3">
                            <i class="bi bi-people fs-3 text-success"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100" style="border-left: 5px solid #ffc107 !important;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-uppercase text-muted small fw-bold mb-2">Emprunts</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalEmprunts}">0</div>
                        </div>
                        <div class="bg-warning bg-opacity-10 rounded-circle p-3">
                            <i class="bi bi-arrow-left-right fs-3 text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100" style="border-left: 5px solid #dc3545 !important;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-uppercase text-muted small fw-bold mb-2">En cours</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${empruntsEnCours}">0</div>
                        </div>
                        <div class="bg-danger bg-opacity-10 rounded-circle p-3">
                            <i class="bi bi-hourglass-split fs-3 text-danger"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== HISTORIQUE + EMPRUNTS ===== -->
    <div class="row g-4">

        <!-- Historique -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark">
                        <i class="bi bi-clock-history text-primary"></i> Historique des actions
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Date</th>
                                <th>Action</th>
                                <th>Description</th>
                                <th>Client</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="h : ${historiques}">
                                <td class="ps-3 text-muted small"
                                    th:text="${#temporals.format(h.dateAction, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${h.action == 'EMPRUNT' ? 'bg-warning text-dark' :
                                                          (h.action == 'RETOUR' ? 'bg-success' :
                                                          (h.action == 'AJOUT' ? 'bg-primary' : 'bg-secondary'))}"
                                          th:text="${h.action}"></span>
                                </td>
                                <td th:text="${h.description}"></td>
                                <td th:text="${h.client != null ? h.client.nom : '—'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(historiques)}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Aucune action enregistrée
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Derniers emprunts -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark">
                        <i class="bi bi-list-check text-success"></i> Derniers emprunts
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Client</th>
                                <th>Livre</th>
                                <th>Statut</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="e : ${derniersEmprunts}">
                                <td class="ps-3 fw-semibold"
                                    th:text="${e.client != null ? e.client.nom : 'N/A'}"></td>
                                <td th:text="${e.livre != null ? e.livre.titre : 'N/A'}"></td>
                                <td>
                                    <span th:if="${e.dateRetour == null}"
                                          class="badge bg-warning text-dark">
                                        <i class="bi bi-hourglass"></i> En cours
                                    </span>
                                    <span th:if="${e.dateRetour != null}"
                                          class="badge bg-success">
                                        <i class="bi bi-check-circle"></i> Retourné
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(derniersEmprunts)}">
                                <td colspan="3" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Aucun emprunt
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS LOCAL -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
